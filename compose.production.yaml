# Production overlay for LocaleHub.
#
#   docker compose -f compose.yaml -f compose.production.yaml up -d
#
# Differences from the development compose file:
#   - secrets come from files (docker secrets or a mounted secret directory), never env literals
#   - PostgreSQL and Redis are not published to the host
#   - all images are pinned by digest-ready tags and run read-only with resource limits
#   - nginx terminates TLS in front of web/api
#
# Ports are cleared with `!reset []`, not `ports: []`: Compose ignores an empty list in an
# override file and the base service keeps publishing its host port.

name: localehub

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=2000

  redis:
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "/run/secrets/redis_password"]
    secrets:
      - redis_password

  api:
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      LOG_LEVEL: info
      # nginx terminates TLS in front of this stack, so the guard stays on. It has to be stated
      # here: environment maps merge, so `ALLOW_INSECURE_HTTP: "true"` from compose.yaml would
      # otherwise follow the API into production.
      ALLOW_INSECURE_HTTP: "false"
      # One proxy in front. Express otherwise reports the socket address — nginx — as the client,
      # so every caller would share one rate-limit bucket and one audit identity.
      TRUST_PROXY: "1"
      # Public address of the Remote MCP behind nginx; the Web UI shows this to clients.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://localhost/mcp}
      # Likewise the address the CLI is told to call: it runs on a developer's machine, so
      # the inherited `http://localhost:3001` would point at the developer's own laptop.
      API_BASE_URL: ${API_BASE_URL:-https://localhost/api/v1}
      # The browser is served by nginx on the same host, so the cookie-authenticated writes it
      # sends have that origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
    secrets:
      - database_url
      - redis_url
      - auth_secret
      - encryption_key
    read_only: true
    tmpfs:
      - /tmp
    # nginx is the only entry point, and these run two replicas: a published host port would be
    # both unnecessary and impossible to bind twice (`Bind for 0.0.0.0:3001 failed: port is
    # already allocated`), so the second replica would never start.
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1g

  worker:
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    secrets:
      - database_url
      - redis_url
      - auth_secret
      - encryption_key
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1g

  mcp-remote:
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      MCP_REMOTE_ENABLED: "true"
    secrets:
      - database_url
      - auth_secret
      - encryption_key
    # Reachable through nginx only; nothing should reach it directly from the host.
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  web:
    environment:
      NODE_ENV: production
      # The address the rewrite proxies to is a build arg (see docker/web.Dockerfile), inherited
      # from compose.yaml; setting it here would look right and do nothing.
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/localehub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  redis_url:
    file: ./secrets/redis_url
  redis_password:
    file: ./secrets/redis_password
  auth_secret:
    file: ./secrets/auth_secret
  encryption_key:
    file: ./secrets/encryption_key
