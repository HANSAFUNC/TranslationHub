# Production overlay for LocaleHub.
#
#   docker compose -f compose.yaml -f compose.production.yaml up -d
#
# Differences from the development compose file:
#   - secrets come from files (docker secrets or a mounted secret directory), never env literals
#   - PostgreSQL and Redis are not published to the host
#   - all images are pinned by digest-ready tags and run read-only with resource limits
#   - nginx terminates TLS in front of web/api

name: localehub

services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=2000

  redis:
    ports: []
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "/run/secrets/redis_password"]
    secrets:
      - redis_password

  api:
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      LOG_LEVEL: info
    secrets:
      - database_url
      - redis_url
      - auth_secret
      - encryption_key
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1g

  worker:
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    secrets:
      - database_url
      - redis_url
      - auth_secret
      - encryption_key
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1g

  mcp-remote:
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      MCP_REMOTE_ENABLED: "true"
    secrets:
      - database_url
      - auth_secret
      - encryption_key
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  web:
    environment:
      NODE_ENV: production
      API_BASE_URL_INTERNAL: http://api:3001/api/v1
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/localehub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  redis_url:
    file: ./secrets/redis_url
  redis_password:
    file: ./secrets/redis_password
  auth_secret:
    file: ./secrets/auth_secret
  encryption_key:
    file: ./secrets/encryption_key
