name: localehub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: localehub
      LOCALEHUB_APP_PASSWORD: localehub
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d localehub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://localehub_app:localehub@postgres:5432/localehub?schema=public
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/localehub?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-encryption-key-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001/api/v1}
      # Every origin a browser will type. The default covers the machine itself; to let other
      # machines on the LAN log in, add their address too (an origin that is missing here is
      # refused with 403 CSRF_VERIFICATION_FAILED, and the login form simply does nothing):
      #   CORS_ORIGINS=http://localhost:3000,http://192.168.1.20:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # What the Web UI and `localehub mcp-config` tell clients to connect to. The MCP client
      # runs on a developer's machine, so it must be an address reachable from there — not the
      # in-network `mcp-remote:3003`.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3003/mcp}
      # This stack is plain HTTP on localhost and nothing terminates TLS for it. NODE_ENV is
      # `production` here (that is what makes the images behave like the deployed ones), so
      # without this opt-in every authenticated request would be refused with
      # INSECURE_TRANSPORT: pages would load and login would succeed, then nothing else would
      # work. The production overlay sets it back to "false" explicitly, because Compose merges
      # environment maps and a value only set here would otherwise be inherited there.
      ALLOW_INSECURE_HTTP: "true"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "apps/worker/dist/main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://localehub_app:localehub@postgres:5432/localehub?schema=public
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/localehub?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-encryption-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp-remote:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "apps/mcp-remote/dist/main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgresql://localehub_app:localehub@postgres:5432/localehub?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-encryption-key-change-me}
      MCP_REMOTE_ENABLED: "true"
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Bake-time, not runtime: Next writes the rewrite destination into the build. See the
        # Dockerfile for what a runtime-only value silently does.
        API_BASE_URL_INTERNAL: http://api:3001/api/v1
    restart: unless-stopped
    environment:
      # The browser calls its own origin (`/api/v1`) and the rewrite above forwards to the API,
      # so no origin needs configuring here; NEXT_PUBLIC_API_BASE_URL would have to be a build
      # arg to have any effect at all, and setting it at runtime does nothing.
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
